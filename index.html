<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiftSMP - Shop</title>
    
    <!-- === INFOMEBOX FÜR DISCORD / LINK-VORSCHAU (OPEN GRAPH) === -->
    <meta property="og:title" content="RiftSMP - Offizieller Webshop" />
    <meta property="og:description" content="Kaufe Premium-Ränge und Crate Key Bundles für RiftSMP. Starte jetzt dein Abenteuer!" />
    <meta property="og:url" content="https://github.io" />
    <meta property="og:image" content="https://github.iologo.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#a066ff"> <!-- Die Farbe des vertikalen Strichs auf Discord (Lila) -->
    
    <!-- Das Logo als Symbol im Browser-Tab -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Feste Kopfzeile (Navbar) -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand" onclick="switchCategory('home')">
                <img src="logo.png" alt="RiftSMP Logo" class="nav-logo">
                <span class="brand-text">RIFT<span>SMP</span></span>
            </div>
            <ul class="nav-links">
                <li class="nav-item active" id="menu-home" onclick="switchCategory('home')"><a href="javascript:void(0)">Home</a></li>
                <li class="nav-item" id="menu-crates" onclick="switchCategory('crates')"><a href="javascript:void(0)">Crate Keys</a></li>
                <li class="nav-item" id="menu-ranks" onclick="switchCategory('ranks')"><a href="javascript:void(0)">Ranks</a></li>
            </ul>
        </div>
    </nav>

    <!-- Header Bereich -->
    <header class="hero">
        <div class="hero-content">
            <p class="subtitle">Welcome to RiftSMP. Type <span>/rip</span> to start your adventure.</p>
            <div class="hero-buttons">
                <a href="https://discord.gg" target="_blank" class="btn btn-discord">Join Our Discord</a>
            </div>
        </div>
    </header>

    <!-- Hauptcontainer -->
    <div class="container">
        
        <!-- Minecraft Name Eingabefeld -->
        <div class="username-container">
            <label for="mc-username">Minecraft-Name für die Käufe:</label>
            <input type="text" id="mc-username" placeholder="Z.B. Notch" autocomplete="off">
        </div>
        
        <!-- Shop-Inhalt (Volle Breite) -->
        <main class="shop-grid" id="shop-content">
            <!-- JavaScript fügt hier die Produkte ein -->
        </main>
    </div>

    <!-- JavaScript für den Kategorie-Wechsel -->
    <script>
        const products = {
            home: [
                { title: "CRATE KEY BUNDLES", desc: "Click to view >", icon: "📦", color: "card-blue bg-crates-cat", type: "category", target: "crates" },
                { title: "RANKS", desc: "Click to view >", icon: "👑", color: "card-purple bg-ranks-cat", type: "category", target: "ranks" }
            ],
            ranks: [
                { title: "Premium Rang", price: "9.99€", desc: "Exklusiver Premium-Rang! Schalte besondere Rechte, einzigartige lila Chat-Farben und Lobbiefunktionen frei.", icon: "💎", color: "card-purple bg-premium-rank", type: "item" }
            ],
            crates: [
                { title: "3x Vote Crate Keys", price: "1.99€", desc: "Öffne die Vote-Kiste am Spawn für nützliche Standard-Items.", icon: "🔑", color: "card-teal bg-vote-crate", type: "item" },
                { title: "5x Mythic Crate Keys", price: "9.99€", desc: "Chance auf legendäre Rüstungen, Werkzeuge und seltene Waffen.", icon: "📦", color: "card-blue bg-mythic-crate", type: "item" }
            ]
        };

        function processPurchase(itemName) {
            const usernameInput = document.getElementById('mc-username').value.trim();
            
            if (usernameInput === "") {
                alert("Bitte gib zuerst deinen Minecraft-Namen ein, damit wir wissen, wer das Item erhalten soll!");
                document.getElementById('mc-username').focus();
            } else {
                alert(`Kauf von "${itemName}" für den Spieler "${usernameInput}" gestartet!`);
            }
        }

        function switchCategory(categoryName) {
            const contentGrid = document.getElementById('shop-content');
            contentGrid.innerHTML = ""; 

            document.querySelectorAll('.navbar .nav-item').forEach(el => el.classList.remove('active'));
            const activeMenuItem = document.getElementById(`menu-${categoryName}`);
            if (activeMenuItem) {
                activeMenuItem.classList.add('active');
            }

            const items = products[categoryName];
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `product-card ${item.color}`;
                
                if (item.type === "category") {
                    card.onclick = () => {
                        switchCategory(item.target);
                    };
                    card.innerHTML = `
                        <div class="card-overlay"></div>
                        <div class="card-inner">
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="card-overlay"></div>
                        <div class="card-inner">
                            <h3>${item.title}</h3>
                            <div class="product-price">${item.price}</div>
                            <p>${item.desc}</p>
                            <button class="buy-btn" onclick="processPurchase('${item.title}')">In den Warenkorb</button>
                        </div>
                    `;
                }
                
                contentGrid.appendChild(card);
            });
        }

        window.onload = () => {
            switchCategory('home');
        };
    </script>
</body>
</html>
